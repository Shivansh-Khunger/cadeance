# The agent's CI. GitHub only runs workflows from the repo root's
# .github/workflows, so this lives here and runs in agent/.
name: Agent

on:
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agent.yml"]
  pull_request:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agent.yml"]

defaults:
  run:
    working-directory: agent

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff linter
        run: uv run ruff check --output-format=github .

      - name: Run ruff formatter
        run: uv run ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        env:
          # The agent and the LLM judge both call OpenRouter.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run pytest -v
