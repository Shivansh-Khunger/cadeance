# Self-hosted LiveKit server for local development.
#   docker compose -f infra/livekit/docker-compose.yml up -d
# See README.md in this folder.
services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Published on loopback only: the dev key pair is public.
      - "127.0.0.1:7880:7880" # signal (WebSocket + HTTP API)
      - "127.0.0.1:7881:7881" # ICE over TCP
      - "127.0.0.1:50000-50100:50000-50100/udp" # ICE over UDP, matches rtc.port_range_*
